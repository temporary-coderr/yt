name: BEST QUALITY Daily Auto 5:30 AM IST

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  auto-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: |
          pip install groq gTTS moviepy==1.0.3 Pillow requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p clips
      - name: Restore YouTube token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: echo "$YOUTUBE_TOKEN_JSON" > token.json
      - name: Generate BEST video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python final_best_quality_bot.py
      - name: Upload to YOUR channel
        run: python youtube_uploader.py
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: video_*.mp4
          retention-days: 7
