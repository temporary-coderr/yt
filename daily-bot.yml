name: GOOGLE FREE Voice Daily Auto 5:30 AM IST

on:
  schedule:
    - cron: '0 0 * * *'  # Daily 5:30 AM IST - auto even when home net off
  workflow_dispatch:  # Manual run button

jobs:
  auto-bot-google-free:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GOOGLE FREE libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p clips

      - name: Restore YouTube token (connects to YOUR channel)
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: echo "$YOUTUBE_TOKEN_JSON" > token.json

      - name: Generate with GOOGLE FREE voice (no payment)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python final_google_free_bot.py

      - name: Auto-upload to YOUR channel
        run: python youtube_uploader.py

      - name: Upload artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: google-free-video-${{ github.run_number }}
          path: video_*.mp4
          retention-days: 7
